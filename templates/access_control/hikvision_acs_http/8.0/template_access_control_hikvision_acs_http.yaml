        - uuid: fe261eaffb5f430ea530a35484a06089
          name: 'Wireless: Status'
          type: DEPENDENT
          key: hikvision_acs.wlan.status
          trends: '0'
          description: 'Wireless interface status: Disabled, Disconnected, Connected or Not present.'
          valuemap:
            name: 'Wireless status'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var l = JSON.parse(value).NetworkInterfaceList.NetworkInterface;
                  var w = l.filter(function (i) { return i.Wireless; })[0];
                  if (!w) return 3;
                  if (String(w.Wireless.enabled) !== 'true') return 0;
                  var s = w.Wireless.ssid;
                  var connected = s !== null && s !== undefined && String(s).trim() !== '' && String(s) !== 'null';
                  return connected ? 2 : 1;
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: network
            - tag: component
              value: wireless
          triggers:
            - uuid: fab65221f3944316862c1995dc33d771
              expression: |
                last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)>0
                and last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)<3
                and {$WLAN.ALLOWED}=0
              name: 'Wireless: Enabled on a device where it is not allowed'
              opdata: 'Wireless: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Wireless is enabled, but this device is not allowed to use it ({$WLAN.ALLOWED}=0). Disable it or review the macro.'
              tags:
                - tag: scope
                  value: security
        - uuid: 5fc73e03b04e478b80de0c9f9fd8b2a9
          name: 'Wireless: Subnet mask'
          type: DEPENDENT
          key: hikvision_acs.wlan.subnet_mask
          value_type: CHAR
          description: 'Subnet mask of the wireless interface. "Disabled", "Disconnected" or "Not present" when not applicable.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var l = JSON.parse(value).NetworkInterfaceList.NetworkInterface;
                  var w = l.filter(function (i) { return i.Wireless; })[0];
                  if (!w) return 'Not present';
                  if (String(w.Wireless.enabled) !== 'true') return 'Disabled';
                  var s = w.Wireless.ssid;
                  if (s === null || s === undefined || String(s).trim() === '' || String(s) === 'null') return 'Disconnected';
                  return (w.IPAddress || {}).subnetMask || '-';
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: network
            - tag: component
              value: wireless
