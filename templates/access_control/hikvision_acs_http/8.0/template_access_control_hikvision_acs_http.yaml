zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 3f3e16c00c2b4bc9bd85cd25e955a513
      name: 'Templates/Access control'
  templates:
    - uuid: fc2ef8f76f084bad810274087334f239
      template: 'Hikvision access control by HTTP'
      name: 'Hikvision access control by HTTP'
      description: |
        Monitors Hikvision MinMoe access control readers via ISAPI (HTTP agent): availability, capacity, time, network, VoIP, Hik-Connect and security settings.
        
        Source: https://github.com/caiovernaglia/zabbix-templates/tree/main/templates/access_control/hikvision_acs_http/8.0
      vendor:
        name: 'Caio Vernaglia'
        version: 8.0-1
      templates:
        - name: 'ICMP Ping'
      groups:
        - name: 'Templates/Access control'
      items:
        - uuid: 29aa33316e574d74bdad1208e4349fb6
          name: 'Capacity: Cards: Used'
          type: DEPENDENT
          key: 'hikvision_acs.capacity[cards,used]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.UserInfoCount.bindCardUserNumber
          master_item:
            key: hikvision_acs.get_device_capacity
          tags:
            - tag: component
              value: capacity
            - tag: resource
              value: cards
          triggers:
            - uuid: d1a534dd9f82454197f0b744cc906795
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.capacity[cards,used])>{$CAPACITY.CARDS.MAX}*{$CAPACITY.THRESHOLD.WARN}/100'
              name: 'Capacity: Cards nearly full (> {$CAPACITY.THRESHOLD.WARN}% of {$CAPACITY.CARDS.MAX})'
              opdata: 'Current cards count: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Cards count greater than warning limit.'
              tags:
                - tag: resource
                  value: cards
                - tag: scope
                  value: capacity
            - uuid: b58a7cbc4175410bb4e4c2b3d97dc009
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.capacity[cards,used])>{$CAPACITY.CARDS.MAX}*{$CAPACITY.THRESHOLD.INFO}/100'
              name: 'Capacity: Cards usage is high (> {$CAPACITY.THRESHOLD.INFO}% of {$CAPACITY.CARDS.MAX})'
              opdata: 'Current cards count: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'Cards count greater than info limit.'
              dependencies:
                - name: 'Capacity: Cards nearly full (> {$CAPACITY.THRESHOLD.WARN}% of {$CAPACITY.CARDS.MAX})'
                  expression: 'last(/Hikvision access control by HTTP/hikvision_acs.capacity[cards,used])>{$CAPACITY.CARDS.MAX}*{$CAPACITY.THRESHOLD.WARN}/100'
              tags:
                - tag: resource
                  value: cards
                - tag: scope
                  value: capacity
        - uuid: 16eb032d181b457298a8fa5c4eec7f10
          name: 'Capacity: Faces: Used'
          type: DEPENDENT
          key: 'hikvision_acs.capacity[faces,used]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.UserInfoCount.bindFaceUserNumber
          master_item:
            key: hikvision_acs.get_device_capacity
          tags:
            - tag: component
              value: capacity
            - tag: resource
              value: faces
          triggers:
            - uuid: e839b529791d4fb0adda62a5b8dc530f
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.capacity[faces,used])>{$CAPACITY.FACES.MAX}*{$CAPACITY.THRESHOLD.WARN}/100'
              name: 'Capacity: Faces nearly full (> {$CAPACITY.THRESHOLD.WARN}% of {$CAPACITY.FACES.MAX})'
              opdata: 'Current faces count: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Faces count greater than warning limit.'
              tags:
                - tag: resource
                  value: faces
                - tag: scope
                  value: capacity
            - uuid: a1ac046cd36b48348e8ca3ce04dd435e
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.capacity[faces,used])>{$CAPACITY.FACES.MAX}*{$CAPACITY.THRESHOLD.INFO}/100'
              name: 'Capacity: Faces usage is high (> {$CAPACITY.THRESHOLD.INFO}% of {$CAPACITY.FACES.MAX})'
              opdata: 'Current faces count: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'Faces count greater than info limit.'
              dependencies:
                - name: 'Capacity: Faces nearly full (> {$CAPACITY.THRESHOLD.WARN}% of {$CAPACITY.FACES.MAX})'
                  expression: 'last(/Hikvision access control by HTTP/hikvision_acs.capacity[faces,used])>{$CAPACITY.FACES.MAX}*{$CAPACITY.THRESHOLD.WARN}/100'
              tags:
                - tag: resource
                  value: faces
                - tag: scope
                  value: capacity
        - uuid: 7025592634c04dcd8a1ddc66b101342f
          name: 'Capacity: Users: Used'
          type: DEPENDENT
          key: 'hikvision_acs.capacity[users,used]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.UserInfoCount.userNumber
          master_item:
            key: hikvision_acs.get_device_capacity
          tags:
            - tag: component
              value: capacity
            - tag: resource
              value: users
          triggers:
            - uuid: 8ff827e3f5d94917b1701d5907e16395
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.capacity[users,used])>{$CAPACITY.USERS.MAX}*{$CAPACITY.THRESHOLD.WARN}/100'
              name: 'Capacity: Users nearly full (> {$CAPACITY.THRESHOLD.WARN}% of {$CAPACITY.USERS.MAX})'
              opdata: 'Current users count: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Users count greater than warning limit.'
              tags:
                - tag: resource
                  value: users
                - tag: scope
                  value: capacity
            - uuid: cd0dedb3c0b84afbb1f5385fff0477b6
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.capacity[users,used])>{$CAPACITY.USERS.MAX}*{$CAPACITY.THRESHOLD.INFO}/100'
              name: 'Capacity: Users usage is high (> {$CAPACITY.THRESHOLD.INFO}% of {$CAPACITY.USERS.MAX})'
              opdata: 'Current users count: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'Users count greater than info limit.'
              dependencies:
                - name: 'Capacity: Users nearly full (> {$CAPACITY.THRESHOLD.WARN}% of {$CAPACITY.USERS.MAX})'
                  expression: 'last(/Hikvision access control by HTTP/hikvision_acs.capacity[users,used])>{$CAPACITY.USERS.MAX}*{$CAPACITY.THRESHOLD.WARN}/100'
              tags:
                - tag: resource
                  value: users
                - tag: scope
                  value: capacity
        - uuid: 637ff3eb3661426a82a4013b9593d74d
          name: 'Hik-Connect: Status'
          type: DEPENDENT
          key: hikvision_acs.cloud.status
          valuemap:
            name: 'Cloud status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.AcsWorkStatus.ezvizStatus
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value === 'notEnabled') return 0;
                  if (value === 'unregistered') return 1;
                  if (value === 'connect') return 2;
                  throw 'ezvizStatus desconhecido: ' + value;
          master_item:
            key: hikvision_acs.get_work_status
          tags:
            - tag: component
              value: cloud
            - tag: component
              value: communication
          triggers:
            - uuid: 2ad184c173eb4c28b50d8ecae2ece541
              expression: '(last(/Hikvision access control by HTTP/hikvision_acs.cloud.status,#1)>0)<>(last(/Hikvision access control by HTTP/hikvision_acs.cloud.status,#2)>0)'
              recovery_mode: NONE
              name: 'Hik-Connect: Configuration has changed ({ITEM.LASTVALUE1})'
              priority: INFO
              description: 'Hik-Connect has been enabled or disabled. Ack to close.'
              type: MULTIPLE
              manual_close: 'YES'
              dependencies:
                - name: 'Hik-Connect: Enabled on a device where it is not allowed'
                  expression: 'last(/Hikvision access control by HTTP/hikvision_acs.cloud.status)>0 and {$HIKCONNECT.ALLOWED}=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: 361c8f79688f4045997cee8eb34f9fb3
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.cloud.status)>0 and {$HIKCONNECT.ALLOWED}=0'
              name: 'Hik-Connect: Enabled on a device where it is not allowed'
              opdata: 'Hik-Connect: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Hik-Connect is enabled, but this device is not allowed to use it ({$HIKCONNECT.ALLOWED}=0). Disable it or review the macro.'
              tags:
                - tag: scope
                  value: security
            - uuid: 0a9557bba5384eaba176afa8d42d0649
              expression: 'max(/Hikvision access control by HTTP/hikvision_acs.cloud.status,#2)=1 and {$HIKCONNECT.ALLOWED}=1'
              name: 'Hik-Connect: Not connected'
              opdata: 'Hik-Connect: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'Hik-Connect is enabled and allowed, but the device is not connected to the Hik-Connect cloud. Mobile app features will not work.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 350b580e498d4f1f92024e6aaa2cde94
          name: 'Device: Firmware'
          type: DEPENDENT
          key: hikvision_acs.device.firmware
          value_type: CHAR
          inventory_link: SOFTWARE
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value).DeviceInfo;
                  return d.firmwareVersion + ' ' + d.firmwareReleasedDate;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_device_info
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 5c35fbb230b14b3f91845b04d3e25835
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.device.firmware,#1)<>last(/Hikvision access control by HTTP/hikvision_acs.device.firmware,#2) and length(last(/Hikvision access control by HTTP/hikvision_acs.device.firmware))>0'
              recovery_mode: NONE
              name: 'Hikvision ACS: Firmware version has changed'
              event_name: 'Hikvision Access Control: Firmware version has changed (new version: {ITEM.VALUE})'
              priority: INFO
              description: 'Firmware version has changed. Ack to close.'
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 093ccc96e39a4484af661c990f46c209
          name: 'Device: Hardware version'
          type: DEPENDENT
          key: hikvision_acs.device.hardware
          value_type: CHAR
          inventory_link: HARDWARE
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.DeviceInfo.hardwareVersion
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_device_info
          tags:
            - tag: component
              value: system
        - uuid: 51682b50b34c48e4b58e1ed5d0118700
          name: 'Device: Manufacturer'
          type: DEPENDENT
          key: hikvision_acs.device.manufacturer
          value_type: CHAR
          inventory_link: VENDOR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.DeviceInfo.manufacturer
            - type: JAVASCRIPT
              parameters:
                - 'return value.charAt(0).toUpperCase() + value.slice(1);'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_device_info
          tags:
            - tag: component
              value: system
        - uuid: 49e89c996d614d89852ac3bb901e1bc4
          name: 'Device: Model'
          type: DEPENDENT
          key: hikvision_acs.device.model
          value_type: CHAR
          inventory_link: MODEL
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.DeviceInfo.model
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_device_info
          tags:
            - tag: component
              value: system
        - uuid: fc33f024d61743ceb9f967a83d9af62b
          name: 'Device: Name'
          type: DEPENDENT
          key: hikvision_acs.device.name
          value_type: CHAR
          inventory_link: NAME
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.DeviceInfo.deviceName
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_device_info
          tags:
            - tag: component
              value: system
        - uuid: f2abda9923be453290b8f9d9046b0b77
          name: 'Device: Serial number'
          type: DEPENDENT
          key: hikvision_acs.device.serial
          value_type: CHAR
          inventory_link: SERIALNO_A
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.DeviceInfo.serialNumber
            - type: REGEX
              parameters:
                - '.{9}$'
                - \0
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_device_info
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 9a67ab2a04cc405cbe1eca6d5a80d955
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.device.serial,#1)<>last(/Hikvision access control by HTTP/hikvision_acs.device.serial,#2) and length(last(/Hikvision access control by HTTP/hikvision_acs.device.serial))>0'
              recovery_mode: NONE
              name: 'Hikvision ACS: Equipment has been replaced'
              event_name: 'Hikvision Access Control: Equipment has been replaced (new serial number received)'
              priority: INFO
              description: 'Equipment serial number has changed. Ack to close.'
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 3af31899ef584c1eb8efacbf0f2dd50d
          name: 'Device: Type'
          type: DEPENDENT
          key: hikvision_acs.device.type
          value_type: CHAR
          inventory_link: TYPE
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.DeviceInfo.subDeviceType
            - type: JAVASCRIPT
              parameters:
                - |
                  return value
                      .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
                      .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
                      .replace(/^./, function (c) { return c.toUpperCase(); });
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_device_info
          tags:
            - tag: component
              value: system
        - uuid: fb1b234e50414a56a1c78f9f68fa8feb
          name: 'Ethernet: Addressing type'
          type: DEPENDENT
          key: hikvision_acs.eth.addressing_type
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.NetworkInterfaceList.NetworkInterface[?(@.id==''1'')].IPAddress.addressingType.first()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: ethernet
            - tag: component
              value: network
          triggers:
            - uuid: dfb790c93959413fb963027003e3fe0e
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.eth.addressing_type)="dynamic"'
              name: 'Ethernet: DHCP addressing in use'
              opdata: 'Addressing: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Device is using DHCP. If the IP address changes, monitoring and VMS integrations will be lost. Configure a static IP address.'
              tags:
                - tag: scope
                  value: notice
        - uuid: cc5bd3bde30d4e38a028485f6d9c07fc
          name: 'Network: Ethernet connection'
          type: DEPENDENT
          key: hikvision_acs.eth.connection
          valuemap:
            name: 'Connection status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.AcsWorkStatus.InterfaceStatusList[?(@.id==1)].netStatus.first()'
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value === 'connect') return 1;
                  if (value === 'disconnect') return 0;
                  throw 'netStatus desconhecido: ' + value;
          master_item:
            key: hikvision_acs.get_work_status
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
        - uuid: 85b10432348f4891b1b711cbe4a08fa8
          name: 'Ethernet: Primary DNS'
          type: DEPENDENT
          key: hikvision_acs.eth.dns_primary
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.NetworkInterfaceList.NetworkInterface[?(@.id==''1'')].IPAddress.PrimaryDNS.ipAddress.first()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: ethernet
            - tag: component
              value: network
        - uuid: 103b0e25e05a463d8d388194e852e09f
          name: 'Ethernet: Secondary DNS'
          type: DEPENDENT
          key: hikvision_acs.eth.dns_secondary
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.NetworkInterfaceList.NetworkInterface[?(@.id==''1'')].IPAddress.SecondaryDNS.ipAddress.first()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: ethernet
            - tag: component
              value: network
        - uuid: 561aca8a7c7b4493bbf534ec2a4483b4
          name: 'Ethernet: Gateway'
          type: DEPENDENT
          key: hikvision_acs.eth.gateway
          value_type: CHAR
          inventory_link: HOST_ROUTER
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.NetworkInterfaceList.NetworkInterface[?(@.id==''1'')].IPAddress.DefaultGateway.ipAddress.first()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: ethernet
            - tag: component
              value: network
        - uuid: 72838284b6d44b8f893677e4b1a7387e
          name: 'Ethernet: IP address'
          type: DEPENDENT
          key: hikvision_acs.eth.ip
          value_type: CHAR
          inventory_link: HOST_NETWORKS
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.NetworkInterfaceList.NetworkInterface[?(@.id==''1'')].IPAddress.ipAddress.first()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: ethernet
            - tag: component
              value: network
        - uuid: f9edcf38ed454d25ad4862daa7e37541
          name: 'Ethernet: MAC address'
          type: DEPENDENT
          key: hikvision_acs.eth.mac
          value_type: CHAR
          inventory_link: MACADDRESS_A
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.NetworkInterfaceList.NetworkInterface[?(@.id==''1'')].macAddress.first()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: ethernet
            - tag: component
              value: network
        - uuid: cd0f101d00c448e8b5d98e41113f2614
          name: 'Ethernet: Subnet mask'
          type: DEPENDENT
          key: hikvision_acs.eth.subnet_mask
          value_type: CHAR
          inventory_link: HOST_NETMASK
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.NetworkInterfaceList.NetworkInterface[?(@.id==''1'')].IPAddress.subnetMask.first()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: ethernet
            - tag: component
              value: network
        - uuid: 1c847ec812c84b6ea57296cc26319c67
          name: 'Raw: Admin accesses'
          type: HTTP_AGENT
          key: hikvision_acs.get_admin_accesses
          delay: 1h
          history: '0'
          value_type: TEXT
          authtype: DIGEST
          username: '{$ISAPI.USER}'
          password: '{$ISAPI.PASSWORD}'
          preprocessing:
            - type: XML_TO_JSON
          timeout: 3s
          url: '{$ISAPI.SCHEME}://{HOST.CONN}:{$ISAPI.PORT}/ISAPI/Security/adminAccesses'
          status_codes: '200, 401'
          tags:
            - tag: component
              value: raw
        - uuid: d9e1672b1c46469d91929422df32b921
          name: 'Raw: Capacity'
          type: HTTP_AGENT
          key: hikvision_acs.get_device_capacity
          delay: 30m
          history: '0'
          value_type: TEXT
          authtype: DIGEST
          username: '{$ISAPI.USER}'
          password: '{$ISAPI.PASSWORD}'
          timeout: 3s
          url: '{$ISAPI.SCHEME}://{HOST.CONN}:{$ISAPI.PORT}/ISAPI/AccessControl/UserInfo/Count'
          status_codes: '200, 401'
          tags:
            - tag: component
              value: raw
        - uuid: bc6a945240814501bed972407ed8c159
          name: 'Raw: Device info'
          type: HTTP_AGENT
          key: hikvision_acs.get_device_info
          delay: 6h
          history: '0'
          value_type: TEXT
          authtype: DIGEST
          username: '{$ISAPI.USER}'
          password: '{$ISAPI.PASSWORD}'
          preprocessing:
            - type: XML_TO_JSON
          timeout: 3s
          url: '{$ISAPI.SCHEME}://{HOST.CONN}:{$ISAPI.PORT}/ISAPI/System/deviceInfo'
          status_codes: '200, 401'
          tags:
            - tag: component
              value: raw
        - uuid: 572504e41ee5438997e11064279d5eec
          name: 'Raw: Network interfaces'
          type: HTTP_AGENT
          key: hikvision_acs.get_network_interfaces
          delay: 10m
          history: '0'
          value_type: TEXT
          authtype: DIGEST
          username: '{$ISAPI.USER}'
          password: '{$ISAPI.PASSWORD}'
          preprocessing:
            - type: XML_TO_JSON
            - type: JAVASCRIPT
              parameters:
                - |
                  var o;
                  try { o = JSON.parse(value); } catch (e) { throw 'Resposta não é JSON válido (falha de autenticação?)'; }
                  if (!o || !o.NetworkInterfaceList) throw 'Resposta sem NetworkInterfaceList';
                  var l = o.NetworkInterfaceList.NetworkInterface;
                  o.NetworkInterfaceList.NetworkInterface = Array.isArray(l) ? l : (l ? [l] : []);
                  return JSON.stringify(o);
          timeout: 3s
          url: '{$ISAPI.SCHEME}://{HOST.CONN}:{$ISAPI.PORT}/ISAPI/System/Network/interfaces'
          status_codes: '200, 401'
          tags:
            - tag: component
              value: raw
        - uuid: 9f442f0911a74a4982ed5f9600078990
          name: 'Raw: NTP servers'
          type: HTTP_AGENT
          key: hikvision_acs.get_ntp_servers
          delay: 1h
          history: '0'
          value_type: TEXT
          authtype: DIGEST
          username: '{$ISAPI.USER}'
          password: '{$ISAPI.PASSWORD}'
          preprocessing:
            - type: XML_TO_JSON
          url: '{$ISAPI.SCHEME}://{HOST.CONN}:{$ISAPI.PORT}/ISAPI/System/time/ntpServers'
          status_codes: '200, 401'
          tags:
            - tag: component
              value: raw
        - uuid: b9048528f0d94614bf7871ef56c90db3
          name: 'Raw: SIP servers'
          type: HTTP_AGENT
          key: hikvision_acs.get_sip_servers
          delay: 2m
          history: '0'
          value_type: TEXT
          authtype: DIGEST
          username: '{$ISAPI.USER}'
          password: '{$ISAPI.PASSWORD}'
          preprocessing:
            - type: XML_TO_JSON
