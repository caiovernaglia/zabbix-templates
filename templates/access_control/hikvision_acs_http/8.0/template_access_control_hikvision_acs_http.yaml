  triggers:
    - uuid: f654a8a88c8a4970b540e4210edc77d6
      expression: |
        last(/Hikvision access control by HTTP/hikvision_acs.wlan.addressing_type)="dynamic"
        and last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)>0
        and last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)<3
      name: 'Wireless: DHCP addressing in use'
      opdata: 'Addressing: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: 'Wireless interface is using DHCP. If the IP address changes, monitoring and VMS integrations will be lost. Configure a static IP address.'
      dependencies:
        - name: 'Wireless: Enabled on a device where it is not allowed'
          expression: |
            last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)>0
            and last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)<3
            and {$WLAN.ALLOWED}=0
      tags:
        - tag: scope
          value: notice
    - uuid: b62ddd5cc4e14bffbfb96d1455844326
      expression: |
        find(/Hikvision access control by HTTP/hikvision_acs.wlan.security_mode,,"iregexp","^(disable|none|open|wep)$")=1
        and last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)>0
        and last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)<3
      name: 'Wireless: Weak security mode ({ITEM.LASTVALUE1})'
      opdata: 'Security: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: 'Wireless is enabled with no encryption or WEP. Configure WPA2 or higher.'
      dependencies:
        - name: 'Wireless: Enabled on a device where it is not allowed'
          expression: |
            last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)>0
            and last(/Hikvision access control by HTTP/hikvision_acs.wlan.status)<3
            and {$WLAN.ALLOWED}=0
      tags:
        - tag: scope
          value: security
