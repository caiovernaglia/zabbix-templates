          key: hikvision_acs.get_work_status
          delay: 5m
          history: '0'
          value_type: TEXT
          authtype: DIGEST
          username: '{$ISAPI.USER}'
          password: '{$ISAPI.PASSWORD}'
          timeout: 3s
          url: '{$ISAPI.SCHEME}://{HOST.CONN}:{$ISAPI.PORT}/ISAPI/AccessControl/AcsWorkStatus?format=json'
          status_codes: '200, 401'
          tags:
