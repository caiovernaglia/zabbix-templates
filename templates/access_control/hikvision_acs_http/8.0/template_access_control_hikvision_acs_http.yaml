              tags:
                - tag: scope
                  value: notice
        - uuid: 02c3d6dac42f46b69aa4fffefe027746
          name: 'Time: Clock drift'
          type: DEPENDENT
          key: hikvision_acs.time.drift
          value_type: FLOAT
          units: s
          description: 'Difference between the device clock and the Zabbix proxy/server clock. Positive = device ahead.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var t = JSON.parse(value).Time;
                  if (!t || !t.localTime) throw 'Time.localTime ausente';
                  var ts = Date.parse(t.localTime);
                  if (isNaN(ts)) throw 'Formato de data inválido: ' + t.localTime;
                  return Math.round((ts - Date.now()) / 1000);
          master_item:
            key: hikvision_acs.get_time
          tags:
            - tag: component
              value: system
            - tag: component
              value: time
          triggers:
            - uuid: 5bc6318cdd4d4952b601a039f386255d
              expression: 'abs(last(/Hikvision access control by HTTP/hikvision_acs.time.drift))>{$TIME.DRIFT.MAX}'
              name: 'Time: Clock is out of sync (drift > {$TIME.DRIFT.MAX}s)'
              opdata: 'Drift: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Device clock differs from the Zabbix proxy/server clock by more than {$TIME.DRIFT.MAX} seconds. Access schedules and event timestamps may be wrong.'
              tags:
                - tag: scope
                  value: notice
        - uuid: bac04d92516644308fa948fdb4a36226
          name: 'Time: Local time'
          type: DEPENDENT
          key: hikvision_acs.time.local
          units: unixtime
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var t = JSON.parse(value).Time;
                  if (!t || !t.localTime) throw 'Time.localTime ausente';
                  var ts = Date.parse(t.localTime);
                  if (isNaN(ts)) throw 'Formato de data inválido: ' + t.localTime;
                  return Math.floor(ts / 1000);
          master_item:
            key: hikvision_acs.get_time
          tags:
            - tag: component
              value: system
            - tag: component
              value: time
        - uuid: 96a748c19f25496f926fee93b99164ce
          name: 'Time: Sync mode'
          type: DEPENDENT
          key: hikvision_acs.time.sync_mode
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Time.timeMode
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_time
          tags:
            - tag: component
              value: system
            - tag: component
              value: time
          triggers:
            - uuid: bf32442266134b7681e897be5135dca1
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.time.sync_mode)<>"{$TIME.SYNC_MODE}"'
              name: 'Time: Unexpected sync mode ({ITEM.LASTVALUE1})'
              opdata: 'Mode: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'Device time synchronization mode differs from the expected mode ({$TIME.SYNC_MODE}). The clock may drift over time.'
              tags:
                - tag: scope
                  value: notice
        - uuid: 0f35ee859b7d48119c3acc2f23437597
          name: 'Time: UTC offset'
          type: DEPENDENT
          key: hikvision_acs.time.utc_offset
          value_type: CHAR
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var lt = JSON.parse(value).Time.localTime;
                  if (!lt) throw 'Time.localTime ausente';
                  if (/Z$/.test(lt)) return '+00:00';
                  var m = lt.match(/([+-]\d{2}:\d{2})$/);
                  if (!m) throw 'Offset não encontrado em: ' + lt;
                  return m[1];
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_time
          tags:
            - tag: component
              value: system
            - tag: component
              value: time
          triggers:
            - uuid: 4182976b3986448c9516e4496f432867
              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.time.utc_offset)<>"{$TIME.UTC_OFFSET}"'
              name: 'Time: Wrong timezone ({ITEM.LASTVALUE1}, expected {$TIME.UTC_OFFSET})'
              opdata: 'Offset: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Device UTC offset differs from the expected value. Access schedules and event timestamps may be wrong.'
              tags:
                - tag: scope
                  value: notice
        - uuid: 7b811f930ed94409a2708357613105b0
          name: 'VoIP: Status'
          type: DEPENDENT
          key: hikvision_acs.voip.status
          valuemap:
            name: 'VoIP status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.AcsWorkStatus.voipStatus
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value === 'notEnabled') return 0;
                  if (value === 'unregistered') return 1;
                  if (value === 'connect') return 2;
                  throw 'voipStatus desconhecido: ' + value;
          master_item:
            key: hikvision_acs.get_work_status
          tags:
            - tag: component
              value: communication
            - tag: component
              value: voip
          triggers:
            - uuid: df5e6d7a03b3461abf3e331275668de0
              expression: 'max(/Hikvision access control by HTTP/hikvision_acs.voip.status,#2)<2 and {$VOIP.EXPECTED}=1'
              name: 'VoIP: Not registered ({ITEM.LASTVALUE1})'
              opdata: 'VoIP: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'The reader is expected to operate VoIP ({$VOIP.EXPECTED}=1) but is not registered to the SIP server, or VoIP has been disabled. Calls from this reader will not be completed.'
              tags:
                - tag: scope
                  value: availability
        - uuid: b0996050ed394504b86b9e658a9158a5
          name: 'Wireless: Addressing type'
          type: DEPENDENT
          key: hikvision_acs.wlan.addressing_type
          value_type: CHAR
          description: 'IP addressing type of the wireless interface (static or dynamic). "Not present" if the device has no wireless interface.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var l = JSON.parse(value).NetworkInterfaceList.NetworkInterface;
                  var w = l.filter(function (i) { return i.Wireless; })[0];
                  if (!w) return 'Not present';
                  return (w.IPAddress || {}).addressingType || '-';
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
            - tag: component
              value: network
            - tag: component
              value: wireless
        - uuid: 83f0b3733f6b49619005b12a116c142b
          name: 'Network: Wireless connection'
          type: DEPENDENT
          key: hikvision_acs.wlan.connection
          valuemap:
            name: 'Connection status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.AcsWorkStatus.InterfaceStatusList[?(@.id==2)].netStatus.first()'
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value === 'connect') return 1;
                  if (value === 'disconnect') return 0;
                  if (value === 'not_present') return 2;
