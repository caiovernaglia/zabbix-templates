        - uuid: 1c030bcf46404d919a2ca78e8004b1f9
          name: 'Wireless: SSID'
          type: DEPENDENT
          key: hikvision_acs.wlan.ssid
          value_type: CHAR
          description: 'SSID of the wireless network the device is connected to. "-" if not connected; "Not present" if the device has no wireless interface.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var l = JSON.parse(value).NetworkInterfaceList.NetworkInterface;
                  var w = l.filter(function (i) { return i.Wireless; })[0];
                  if (!w) return 'Not present';
                  var s = w.Wireless.ssid;
                  var connected = s !== null && s !== undefined && String(s).trim() !== '' && String(s) !== 'null';
                  return connected ? String(s) : '-';
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: hikvision_acs.get_network_interfaces
          tags:
