              expression: 'last(/Hikvision access control by HTTP/hikvision_acs.security.wss.port,#1)<>last(/Hikvision access control by HTTP/hikvision_acs.security.wss.port,#2)'
              recovery_mode: NONE
              name: 'Security: WebSocketS port has changed ({ITEM.LASTVALUE1})'
