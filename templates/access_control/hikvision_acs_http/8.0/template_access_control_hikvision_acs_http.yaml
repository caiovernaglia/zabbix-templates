              value: raw
        - uuid: ab35e9039d0b4b7183c9ecd93f4b3352
          name: 'ISAPI: Status'
          type: HTTP_AGENT
          key: hikvision_acs.isapi.status
          delay: 5m
          authtype: DIGEST
          username: '{$ISAPI.USER}'
          password: '{$ISAPI.PASSWORD}'
          valuemap:
            name: 'HTTP status'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = value.match(/HTTP\/[\d.]+\s+\d{3}/g);
                  if (!m) throw 'Linha de status HTTP não encontrada';
                  return parseInt(m[m.length - 1].split(/\s+/)[1], 10);
          timeout: 3s
          url: '{$ISAPI.SCHEME}://{HOST.CONN}:{$ISAPI.PORT}/ISAPI/System/deviceInfo'
          status_codes: 100-599
          retrieve_mode: HEADERS
          tags:
            - tag: component
              value: communication
            - tag: component
              value: health
          triggers:
            - uuid: aadfbf27375244af91e74df025900f5a
              expression: |
                count(/Hikvision access control by HTTP/hikvision_acs.isapi.status,#2,"eq",0)
                +count(/Hikvision access control by HTTP/hikvision_acs.isapi.status,#2,"ge",500)=2
              name: 'ISAPI: Service is unavailable'
              opdata: 'Status: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'ISAPI did not respond (timeout/connection refused) or returned a server error (5xx) in the last 2 checks.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Hikvision access control by HTTP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
            - uuid: afc7df0dff6e4c948629cbc4c0dae5a0
              expression: |
                last(/Hikvision access control by HTTP/hikvision_acs.isapi.status)>=400
                and last(/Hikvision access control by HTTP/hikvision_acs.isapi.status)<500
              name: 'ISAPI: Unexpected response code ({ITEM.LASTVALUE1})'
              opdata: 'Status: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ISAPI rejected the request (4xx). Possible configuration error: check credentials, user permissions and URL.'
              dependencies:
                - name: 'ISAPI: Service is unavailable'
                  expression: |
                    count(/Hikvision access control by HTTP/hikvision_acs.isapi.status,#2,"eq",0)
                    +count(/Hikvision access control by HTTP/hikvision_acs.isapi.status,#2,"ge",500)=2
              tags:
                - tag: scope
                  value: availability
